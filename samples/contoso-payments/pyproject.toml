[project]
name = "contoso-payments"
version = "3.4.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg==0.29.0",
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "grpcio-tools>=1.62",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-xdist>=3.5", "ruff>=0.4", "mypy>=1.10"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
files = ["src"]
