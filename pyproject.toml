[project]
name = "foundry-memory"
version = "0.1.0"
description = "Mini enterprise team memory for AI agents - Azure AI Search store, Azure Functions MCP runtime, dream consolidation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "azure-identity>=1.17",
    "mcp>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "azure-functions>=1.20"]

[project.scripts]
foundry-memory = "foundry_memory.cli:app"
foundry-memory-mcp = "foundry_memory.mcp_stdio:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
