name: deploy-functions

# Auto-deploy the MCP runtime when the code it serves changes.
#
# Deploys through azd rather than a direct Functions push, because azd runs the
# `prepackage` hook in azure.yaml — scripts/sync_functions.sh vendors src/tacit
# into functions/. Without that step the uploaded package has no tacit module
# and every tool call fails at import.
#
# Auth is federated (OIDC): no publish profile, no secret, matching the keyless
# posture of the rest of the project. The federated credential matches the
# branch subject, so the deploy job must not declare a GitHub `environment` —
# that would make GitHub mint an environment-scoped subject instead, and the
# token exchange would fail with AADSTS700213.

on:
  push:
    branches: [master]
    paths:
      - "functions/**"
      - "src/tacit/**"
      - "azure.yaml"
      - "scripts/sync_functions.sh"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

# One deploy at a time; queued rather than cancelled, since cancelling mid-push
# can leave the app on a half-uploaded package.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev --python 3.12
      - run: uv run --extra dev pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    steps:
      - uses: actions/checkout@v4

      - uses: Azure/setup-azd@v2

      - name: Sign in to azd (federated credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider github \
            --tenant-id "$AZURE_TENANT_ID"

      # The runner has no .azure/ directory, so the environment is recreated.
      # AZURE_RESOURCE_GROUP must be set explicitly: a fresh environment
      # otherwise defaults to rg-<env-name> and azd tries to create it.
      #
      # Deliberately no `azd env refresh` — it initializes the provisioning
      # manager, which asserts the resource group exists and so needs write
      # access this deploy identity does not have. `azd deploy` resolves the
      # app from its `azd-service-name` tag instead, which is all it needs.
      - name: Restore the azd environment
        run: |
          azd env new "$AZURE_ENV_NAME" \
            --location "$AZURE_LOCATION" \
            --subscription "$AZURE_SUBSCRIPTION_ID"
          azd env set AZURE_RESOURCE_GROUP "$AZURE_RESOURCE_GROUP"

      - name: Deploy
        run: azd deploy api --no-prompt
